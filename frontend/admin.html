<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garage Admin</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <nav class="nav" aria-label="Primary">
        <a class="nav-link" href="/">Garage</a>
        <a class="nav-link active" href="/admin" aria-current="page">Administration</a>
      </nav>

      <main>
        <h1>Administration</h1>
        <p class="subtitle">Alerts, webhook delivery, and diagnostics.</p>

        <section class="admin-section" aria-labelledby="diag-heading">
          <h2 id="diag-heading" class="section-title">Diagnostics</h2>
          <div id="diag-strip" class="stat-strip" aria-live="polite">
            <p class="empty">Loading health…</p>
          </div>
          <p class="alert-meta"><a href="/health">Full health JSON</a></p>
        </section>

        <section class="admin-section" aria-labelledby="door-alerts-heading">
          <h2 id="door-alerts-heading" class="section-title">Door alerts</h2>
          <div id="door-alerts-grid" class="grid">
            <p class="empty">Loading doors…</p>
          </div>
        </section>

        <section class="card admin-section" aria-labelledby="webhook-heading">
          <div class="card-header">
            <div class="door-name" id="webhook-heading">Webhook</div>
          </div>
          <p id="alert-meta" class="alert-meta">Loading webhook configuration…</p>
          <p class="field-hint">Placeholders: {{door}}, {{state}}, {{minutes}}, {{timestamp}}</p>

          <label class="field-label" for="alertWebhookUrl">Webhook URL</label>
          <input
            type="url"
            id="alertWebhookUrl"
            class="sim-input"
            placeholder="https://ntfy.sh/your-secret-topic"
            data-has-saved="false"
          />

          <label class="field-label" for="alertMethod">HTTP method</label>
          <select id="alertMethod" class="sim-input">
            <option value="POST">POST</option>
            <option value="GET">GET</option>
          </select>

          <div id="contentTypeWrap">
            <label class="field-label" for="alertContentType">Content type</label>
            <select id="alertContentType" class="sim-input">
              <option value="application/json">application/json</option>
              <option value="application/x-www-form-urlencoded">
                application/x-www-form-urlencoded
              </option>
              <option value="text/plain">text/plain</option>
            </select>
          </div>

          <label class="field-label">Arguments</label>
          <div id="argsList" class="args-list"></div>
          <div class="btn-row">
            <button type="button" id="argAddBtn" class="sim-btn sim-btn-secondary">
              Add argument
            </button>
          </div>

          <label class="field-label" for="alertDoor">Door (for test payload)</label>
          <select id="alertDoor" class="sim-input"></select>

          <div class="btn-row">
            <button type="button" id="alertSaveBtn" class="sim-btn">Save</button>
            <button type="button" id="alertTestBtn" class="sim-btn sim-btn-secondary">
              Test webhook
            </button>
          </div>
          <div id="alertResult" class="result-box" hidden></div>
        </section>

        <section class="card admin-section">
          <div class="card-header">
            <div class="door-name">Simulate event</div>
          </div>
          <form id="simForm">
            <label class="field-label" for="simDoor">Door</label>
            <select id="simDoor" required class="sim-input"></select>

            <label class="field-label" for="simAction">Action</label>
            <select id="simAction" required class="sim-input">
              <option value="opened">Opened</option>
              <option value="closed">Closed</option>
              <option value="stopped">Stopped</option>
            </select>

            <button type="submit" id="simBtn" class="sim-btn">Simulate Event</button>
          </form>
          <div id="simResult" class="result-box" hidden></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
